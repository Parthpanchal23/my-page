<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal page for Parth Panchal.">
  <title>Parth Panchal | Personal Page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f3f6f4;
      background: #101512;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 32px) 16px;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(32px, 8vw, 72px);
      border: 1px solid #303a33;
      border-radius: 24px;
      background: #1a211c;
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #8ed3a7;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 9vw, 5rem);
      letter-spacing: -0.06em;
      line-height: 1.08;
    }

    .intro {
      max-width: 42ch;
      margin: 20px auto 36px;
      color: #c4cec7;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1rem;
    }

    ul {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 16px 18px;
      border: 1px solid #354139;
      border-radius: 12px;
      background: #222c25;
      font-weight: 600;
      line-height: 1.5;
    }

    .contact {
      margin-top: 36px;
    }

    .contact a {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 10px;
      background: #286341;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      line-height: 1.4;
    }

    .contact a:hover,
    .contact a:focus-visible {
      background: #347d52;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little about me</p>
    <h1>Parth Panchal</h1>
    <p class="intro">Welcome to my personal page. Here are a few things about me.</p>

    <section aria-labelledby="about-heading">
      <h2 id="about-heading">What I do</h2>
      <ul>
        <li>CE</li>
        <li>Bachelor of Engineering</li>
        <li>Diploma of Engineering</li>
      </ul>
    </section>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in touch</h2>
      <a href="mailto:parthpanchal@gmail.com">Email me</a>
    </section>
  </main>
</body>
</html>
